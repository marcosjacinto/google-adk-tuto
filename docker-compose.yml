services:
  adk:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GOOGLE_CLOUD_PROJECT: geox-cloud-validacao
      GOOGLE_CLOUD_LOCATION: us-central1
      GOOGLE_APPLICATION_CREDENTIALS: /app/credentials.json
    volumes:
      - ${GCP_CREDENTIALS_PATH}:/app/credentials.json:ro
